services:
  nginx:
    image: nginx:1.27-alpine
    ports: ["80:80"]
    volumes: ["./deploy/nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on: [frontend, web-api]
  frontend:
    build: ./frontend
  web-api:
    build: ./backend
    env_file: .env
    expose: ["8000"]
    depends_on: [mysql, redis]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
  mysql:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-dingzi}
      MYSQL_USER: ${MYSQL_USER:-dingzi}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-dingzi}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me}
    volumes: ["mysql_data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    volumes: ["redis_data:/data"]
  celery-worker:
    build: ./backend
    env_file: .env
    command: celery -A app.tasks worker --loglevel=info
    depends_on: [redis, mysql]
  celery-beat:
    build: ./backend
    env_file: .env
    command: celery -A app.tasks beat --loglevel=info
    depends_on: [redis, mysql]
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-minio}
    volumes: ["minio_data:/data"]
    ports: ["9000:9000", "9001:9001"]

volumes:
  mysql_data:
  redis_data:
  minio_data:


