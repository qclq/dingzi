[project]
name = "dingzi-backend"
version = "0.1.0"
description = "Stator defect inspection web API"
requires-python = ">=3.11"
dependencies = [
  "fastapi[standard]>=0.115,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "aiomysql>=0.2,<1.0",
  "alembic>=1.14,<2.0",
  "redis>=5.2,<6.0",
  "celery[redis]>=5.4,<6.0",
  "passlib[bcrypt]>=1.7,<2.0",
  "bcrypt>=4.2,<5.0",
  "httpx>=0.27,<1.0",
  "pyjwt>=2.9,<3.0",
  "watchdog>=4.0,<7.0",
  "openpyxl>=3.1,<4.0",
  "weasyprint>=66.0,<67.0",
]

[dependency-groups]
dev = [
  "aiosqlite>=0.22.1",
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "ruff>=0.8,<1.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff.lint]
ignore = ["B008", "UP017"]
